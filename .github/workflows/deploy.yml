# Publie le site sur GitHub Pages à chaque "push" sur la branche main.
# (Les 2 clés Supabase sont injectées au moment du build depuis les
#  "secrets" du dépôt : Settings → Secrets and variables → Actions.)
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # file d'attente : évite les "Deployment failed, try again later"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Les clés PUBLIQUES Supabase viennent de .env.production (commité).
      # Pas de secrets ici : des secrets vides écraseraient .env.production
      # (les vars d'environnement ont priorité sur les fichiers .env dans Vite).
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
