# Écriture admin ponctuelle (ex : prono d'un joueur passé hors délai sur décision admin).
# Déclenchable par push d'un tag "run-admin*".
name: Écriture admin
on:
  workflow_dispatch:
  push:
    tags:
      - "run-admin*"
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/admin-pred.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
