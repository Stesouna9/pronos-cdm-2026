# Scores automatiques via Apify (Flashscore). Toutes les 30 min + manuel.
# ⚠️ Coûte des crédits Apify (~1 centime/run + selon nb de matchs live).
# Pour mettre en pause : désactive ce workflow dans l'onglet Actions.
name: Scores auto (Apify)

on:
  schedule:
    # Règle "fin de match" (choix de Gabriel) : passage TOUTES LES HEURES, mais
    # Apify n'est appelé QUE si un match a commencé depuis +3h et n'a pas encore
    # son score (garde dans le script → coût nul le reste du temps).
    # → le site est à jour dans l'heure qui suit chaque fin de match.
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-results-apify.mjs
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          APIFY_MAX_ITEMS: "50"
      # Classement de la ligue dans le résumé du run (visible sur GitHub → Actions)
      - name: Classement dans le résumé
        if: always()
        run: node scripts/leaderboard-summary.mjs >> "$GITHUB_STEP_SUMMARY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
