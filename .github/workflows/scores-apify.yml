# Scores automatiques via Apify (Flashscore). Toutes les 30 min + manuel.
# ⚠️ Coûte des crédits Apify (~1 centime/run + selon nb de matchs live).
# Pour mettre en pause : désactive ce workflow dans l'onglet Actions.
name: Scores auto (Apify)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-results-apify.mjs
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          APIFY_MAX_ITEMS: "50"
