# Va chercher les scores tout seul et les range dans Supabase.
# Tourne toutes les 20 minutes (et peut être lancé à la main).
# Les clés sont dans Settings → Secrets and variables → Actions.
name: Scores automatiques

on:
  schedule:
    - cron: "*/20 * * * *"   # toutes les 20 min (heure UTC)
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run fetch-results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          FOOTBALL_COMPETITION: ${{ vars.FOOTBALL_COMPETITION || 'WC' }}
